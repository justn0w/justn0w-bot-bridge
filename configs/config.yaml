server:
  port: 8080

database:
  user: root
  password: 123456
  host: 127.0.0.1
  port: 3306
  name: justn0w_bot_bridge

# 答疑 agent：直接驱动本机的 Claude Code CLI，复用其登录态与代码库上下文。
# 不需要配密钥——CLI 用的是本机已登录的账号。
claude:
  # 按名称走 PATH 查找；填绝对路径可避免 PATH 差异导致启动即失败
  cli_path: claude
  # 每次提问都要冷启动一个子进程，比 HTTP 调用慢，超时给宽松些
  timeout_sec: 120
